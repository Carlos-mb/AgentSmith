[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous code agent for MBPP and SWE-bench tasks"
requires-python = ">=3.10,<3.11"
dependencies = [
    "anyio>=4.5,<5",
    "docker==7.1.0",
    "httpx>=0.27,<1",
    "mcp[cli]==1.26.0",
    "pydantic>=2.0,<3.0",
]

[project.scripts]
sandbox = "agent_smith.sandbox_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_smith"]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
